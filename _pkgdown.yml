reference:
  - title: "Getting started"
    desc: >
      An overview of the package, its options for users and teams, and its 28 supported languages.
    contents:
    - "`AMR`"
    - "`AMR-options`"
    - "`translate`"
    - "`amr_course`"

  - title: "Cleaning data"
    desc: >
      Transform raw input of any kind into valid microorganisms with `as.mo()`, antimicrobials with `as.ab()`, and MIC values and disk diffusion zones with `as.mic()` and `as.disk()`, and retrieve their properties.
  - subtitle: "Microorganisms"
    contents:
    - "`as.mo`"
    - "`mo_property`"
    - "`mo_source`"
    - "`add_custom_microorganisms`"
    - "`mo_matching_score`"
  - subtitle: "Antimicrobials"
    contents:
    - "`as.ab`"
    - "`ab_property`"
    - "`ab_from_text`"
    - "`add_custom_antimicrobials`"
    - "`atc_online_property`"
  - subtitle: "Antivirals"
    contents:
    - "`as.av`"
    - "`av_property`"
    - "`av_from_text`"
  - subtitle: "Test results"
    contents:
    - "`as.mic`"
    - "`as.disk`"

  - title: "Interpreting results as SIR"
    desc: >
      Interpret MIC values and disk diffusion zones as SIR with `as.sir()`, according to EUCAST or CLSI, for every guideline year from 2011 to 2026, and apply interpretive rules. `as.sir()` also cleans existing SIR data.
    contents:
    - "`as.sir`"
    - "`interpretive_rules`"
    - "`custom_interpretive_rules`"

  - title: "Analysing data"
    desc: >
      Select first isolates with `first_isolate()`, generate traditional, combination, syndromic, and WISCA antibiograms with `antibiogram()` and `wisca()`, calculate resistance, and determine multidrug-resistant organisms.
  - subtitle: "Selecting isolates and antimicrobials"
    contents:
    - "`first_isolate`"
    - "`get_episode`"
    - "`key_antimicrobials`"
    - "`top_n_microorganisms`"
    - "`antimicrobial_selectors`"
    - "`guess_ab_col`"
    - "`availability`"
  - subtitle: "Generating antibiograms and WISCA"
    contents:
    - "`antibiogram`"
  - subtitle: "Calculating resistance and susceptibility"
    contents:
    - "`proportion`"
    - "`count`"
    - "`sir_combine`"
    - "`bug_drug_combinations`"
  - subtitle: "Determining multidrug resistance"
    contents:
    - "`mdro`"
    - "`custom_mdro_guideline`"

  - title: "Visualising data"
    desc: >
      Plot MIC values, disk zones, and SIR results in base R or `ggplot2`, with scales and colours tailored to AMR data.
    contents:
    - "`plot`"
    - "`ggplot_sir`"
    - "`ggplot_pca`"

  - title: "Modelling"
    desc: >
      Use AMR data types in `tidymodels` pipelines, and perform principal component analysis or distance calculations on resistance profiles.
    contents:
    - "`amr-tidymodels`"
    - "`pca`"
    - "`mean_amr_distance`"

  - title: "Reference data"
    desc: >
      The data sets underlying this package, all of which can also be [downloaded in other formats](../articles/datasets.html).
  - subtitle: "Microorganisms"
    contents:
    - "`microorganisms`"
    - "`microorganisms.codes`"
    - "`microorganisms.groups`"
  - subtitle: "Antimicrobials"
    contents:
    - "`antimicrobials`"
    - "`WHOCC`"
    - "`dosage`"
  - subtitle: "Breakpoints and intrinsic resistance"
    contents:
    - "`clinical_breakpoints`"
    - "`intrinsic_resistant`"
  - subtitle: "Example data"
    contents:
    - "`example_isolates`"
    - "`example_isolates_unclean`"
    - "`esbl_isolates`"
    - "`WHONET`"

  - title: "Utilities"
    desc: >
      Helper functions for pattern matching with `%like%`, ages, joining and italicising taxonomy, generating random test results, and data export.
    contents:
    - "`like`"
    - "`age`"
    - "`age_groups`"
    - "`join`"
    - "`italicise_taxonomy`"
    - "`random`"
    - "`export_ncbi_biosample`"
  - subtitle: "Statistical tests"
    contents:
    - "`g.test`"
    - "`kurtosis`"
    - "`skewness`"

  - title: "Deprecated functions"
    desc: >
      These still work, but show a warning and will be removed in a future version.
    contents:
    - "`AMR-deprecated`"
    - "`resistance_predict`"
