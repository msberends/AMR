# Run R CMD check on all CRAN packages that depend on AMR, against the development version of AMR installed from this repository.
# This is informative only: it is not a required check, so a failure does not block anything, but it shows which reverse dependencies break before a CRAN release.

on:
  push:
    # only on main
    branches: [main]
  # allow manual runs from the Actions tab
  workflow_dispatch:

name: check-revdeps

jobs:
  check-revdeps:
    runs-on: ubuntu-latest

    name: Reverse dependencies (R-release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # use RStudio Package Manager to quickly install packages
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # AMR has no hard dependencies; pak is used to install the dependencies of the reverse dependencies
          dependencies: '"hard"'
          extra-packages: any::pak

      - name: Install AMR from this repository
        shell: bash
        run: R CMD INSTALL .

      - name: Check reverse dependencies against the installed AMR
        shell: bash
        run: Rscript .github/scripts/check_revdeps.R
